apis:
- name: MarketCheck VIN Decoder API
  description: >-
    Decode 17-digit VINs to extract year, make, model, trim, installed equipment, and full vehicle specifications.
    Available in Basic and NeoVIN Enhanced tiers for comprehensive build-level data.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.marketcheck.com/apis/
  baseURL: https://mc-api.marketcheck.com
  tags:
  - VIN Decoder
  - Vehicle Specifications
  - Vehicle Data
  properties:
  - type: Documentation
    url: https://docs.marketcheck.com/docs/api/cars
- name: MarketCheck Vehicle History API
  description: >-
    Access complete price history, odometer readings, and full listing details for vehicles up to six
    years back by VIN, enabling market analysis and vehicle valuation insights.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.marketcheck.com/apis/
  baseURL: https://mc-api.marketcheck.com
  tags:
  - Vehicle History
  - Price History
  - VIN
  properties:
  - type: Documentation
    url: https://docs.marketcheck.com/docs/api/cars
- name: MarketCheck Price API
  description: >-
    Predict market prices and retrieve MSRP for used vehicles. Three tiers available: Base (predicted
    price + MSRP), Premium (adds comparable vehicles), and Premium Plus (adds full NeoVIN decode).
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.marketcheck.com/marketcheck-price/
  baseURL: https://mc-api.marketcheck.com
  tags:
  - Vehicle Pricing
  - Price Prediction
  - Market Valuation
  properties:
  - type: Documentation
    url: https://docs.marketcheck.com/docs/api/cars
- name: MarketCheck Dealer API
  description: >-
    Search individual dealerships or locate multiple dealerships in a geographic area by radius. Access
    dealer profiles, inventory counts, and dealership group information.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.marketcheck.com/apis/
  baseURL: https://mc-api.marketcheck.com
  tags:
  - Dealer Data
  - Dealership Inventory
  - Geographic Search
  properties:
  - type: Documentation
    url: https://docs.marketcheck.com/docs/api/cars
- name: MarketCheck Market Insights API
  description: >-
    Obtain Market Days Supply (MDS) values, sales statistics, and popular vehicle data to understand supply
    and demand dynamics across the automotive market.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.marketcheck.com/apis/
  baseURL: https://mc-api.marketcheck.com
  tags:
  - Market Analytics
  - Market Days Supply
  - Sales Data
  properties:
  - type: Documentation
    url: https://docs.marketcheck.com/docs/api/cars
- name: MarketCheck OEM Incentives API
  description: >-
